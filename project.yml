
name: PlutoARFlightSim

options:
  bundleIdPrefix: com.vithika
  deploymentTarget:
    iOS: "17.0"

targets:
  PlutoARFlightSim:
    type: application
    platform: iOS
    sources:
      - path: PlutoARFlightSim
        excludes:
          - Resources
      - path: PlutoARFlightSim/Resources
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: "5.0"
        # CHANGE THIS to something unique, e.g. com.vithika.plutoflightsim
        PRODUCT_BUNDLE_IDENTIFIER: com.vithika.PlutoARFlightSim
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Pluto AR Sim"
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera shows the virtual Pluto drone in your real room."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  PlutoARFlightSimTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: PlutoARFlightSim
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.vithika.PlutoARFlightSimTests
